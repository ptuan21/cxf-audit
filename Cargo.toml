[package]
name = "cxf-audit"
version = "0.1.0"
edition = "2021"
description = "Research tooling for auditing CXF (Credential Exchange Format) archives for zip-slip path traversal. Part of the passkey-cxf-security research project."
license = "MIT"
publish = false

[dependencies]
zip = "8.6"
credential-exchange-format = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "cxf-audit"
path = "src/bin/cxf-audit.rs"
