[package]
name = "cxf-audit"
version = "0.1.0"
edition = "2021"
description = "Research tooling for auditing CXF/CXP (Credential Exchange Format/Protocol) implementations: zip-slip, zip-bomb, and version-downgrade checks."
license = "MIT"
repository = "https://github.com/ptuan21/cxf-audit"
homepage = "https://github.com/ptuan21/cxf-audit"
readme = "README.md"
keywords = ["security", "cxf", "passkey", "zip-slip", "audit"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
zip = "8.6"
credential-exchange-format = "0.4"
credential-exchange-protocol = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to 0.20.x: the only window where tree-sitter-rust/kotlin/swift's
# own tree-sitter version requirements overlap (kotlin caps at <0.23, swift
# 0.4.x wants ^0.20.4, rust 0.20.4 wants ~0.20.10). See CONTRIBUTING.md.
tree-sitter = "=0.20.10"
tree-sitter-rust = "=0.20.4"
tree-sitter-kotlin = "=0.3.5"
tree-sitter-swift = "=0.4.0"

[[bin]]
name = "cxf-audit"
path = "src/bin/cxf-audit.rs"
